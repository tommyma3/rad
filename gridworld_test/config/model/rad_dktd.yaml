include: config/model/ad_base.yaml

model: RAD

# AD Transformer - match AD's proven config for DKTD.
# n_transit is environment timesteps; internally this is 3 * n_transit s/a/r tokens.
tf_n_embd: 64
tf_n_layer: 4
tf_n_head: 4
tf_dropout: 0.1
tf_attn_dropout: 0.1
tf_n_inner: 128         # 4x embedding dim
gradient_checkpointing: False
n_transit: 72          # 120 environment timesteps = 360 transformer tokens

# Compression Settings
n_compress_tokens: 54   # Must be a multiple of 3 for s/a/r token consistency
always_use_latent_prefix: True
short_memory_keep: 10   # Recent uncompressed environment timesteps kept after compression
compress_n_layers: 4    # Deeper compression for better representation
compress_n_heads: 4

# Gradient control
max_gradient_rounds: 3

# Curriculum settings (None = unlimited)
max_compressions: null

# Dataset settings
# With always_use_latent_prefix=True, 48 latent slots are reserved first.
# Compression triggers after roughly 104 recent environment timesteps.
min_context_length: 100
max_context_length: 1000
rad_batching_strategy: compression_buckets

# Curriculum with stage-specific length distributions
curriculum_schedule:
  - step: 0
    max_compressions: 2
    length_distribution:
      short: 0.30       # Less short - need compression practice
      medium: 0.55      # More medium - 1-2 compressions
      long: 0.15
      very_long: 0.00
  - step: 25000
    max_compressions: 4
    length_distribution:
      short: 0.20
      medium: 0.45
      long: 0.30
      very_long: 0.05
  - step: 50000
    max_compressions: 6
    length_distribution:
      short: 0.15
      medium: 0.35
      long: 0.35
      very_long: 0.15
  - step: 80000
    max_compressions: null
    length_distribution:
      short: 0.15
      medium: 0.30
      long: 0.30
      very_long: 0.25

# Training
lr: 0.0003
train_batch_size: 1024
test_batch_size: 1024
train_source_timesteps: 1000
train_timesteps: 300000
num_warmup_steps: 2000

# Curriculum-aware LR scheduler settings
stage_warmup_steps: 1000
min_lr_ratio: 0.1

# Best model tracking
save_best_model: True
early_stopping_patience: 10

# Speed-oriented diagnostics/evaluation defaults
progress_interval: 50
eval_num_train_envs: 4
eval_num_test_envs: 4
in_context_eval_episodes: 100

# Compile tensor-heavy submodules while leaving RAD recurrence eager.
torch_compile: True
torch_compile_modules:
  - ad_transformer
  - compression_transformer
torch_compile_mode: reduce-overhead
torch_compile_dynamic: True
torch_compile_fullgraph: False
torch_compile_suppress_errors: True

num_workers: 4
