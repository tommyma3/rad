include: config/model/ad_base.yaml

model: RAD

# AD Transformer - smaller for computational efficiency.
# n_transit is environment timesteps; internally this is 3 * n_transit s/a/r tokens.
tf_n_embd: 64
tf_n_layer: 4
tf_n_head: 4
tf_dropout: 0.1
tf_attn_dropout: 0.1
tf_n_inner: 128         # 2x embedding dim
tf_dim_feedforward: 128 # Effective FFN width used by RAD modules
gradient_checkpointing: False
n_transit: 30           # 40 environment timesteps = 120 transformer tokens

# Compression Settings - compact latent representation
n_compress_tokens: 15   # Must be a multiple of 3 for s/a/r token consistency
always_use_latent_prefix: True
short_memory_keep: 5   # Recent uncompressed environment timesteps kept after compression
compress_n_layers: 3
compress_n_heads: 4

# Gradient control: keep gradients through the most recent compression rounds.
max_gradient_rounds: 3

# Curriculum settings (None = unlimited)
max_compressions: null

# Dataset settings
# With always_use_latent_prefix=True, 15 latent slots are reserved first.
# Compression triggers after roughly 35 recent environment timesteps.
# Length categories adjusted accordingly:
#   short: 20-50 (20-35 no compression, longer short windows compress)
#   medium: 60-150 (1-2 compressions)
#   long: 200-400 (3-8 compressions)
#   very_long: 500-1000 (10+ compressions)
min_context_length: 20
max_context_length: 1000
rad_batching_strategy: compression_buckets

# Curriculum with stage-specific length distributions
# NOTE: Final stage should start well before train_timesteps to allow learning!
curriculum_schedule:
  - step: 0
    max_compressions: 1
    # Focus on short/medium - learn basic AD and single compression
    length_distribution:
      short: 0.60       # No compression: 20-50
      medium: 0.35      # 1-2 compressions: 60-150
      long: 0.05        # Minimal long
      very_long: 0.00   # None
  - step: 30000
    max_compressions: 3
    # More compressions allowed
    length_distribution:
      short: 0.35
      medium: 0.40
      long: 0.20        # 3-8 compressions: 200-400
      very_long: 0.05
  - step: 50000
    max_compressions: 6
    # Balanced distribution
    length_distribution:
      short: 0.25
      medium: 0.30
      long: 0.30
      very_long: 0.15
  - step: 75000
    max_compressions: null  # Unlimited - start 25k steps before end!
    # Final distribution - maintain mix to prevent forgetting
    length_distribution:
      short: 0.25           # Keep short sequences to prevent forgetting!
      medium: 0.25
      long: 0.25
      very_long: 0.25       # 10+ compressions: 500-1000

# Training
lr: 0.0003              # Backward-compatible fallback learning rate
ad_lr: 0.0003           # AD transformer, token embeddings, and action head
compression_lr: 0.0001  # Pretrained compressor and reconstruction decoder
latent_lr: 0.0003       # Latent prefix and latent-update modules
train_batch_size: 256 # Can use larger batch with smaller model
test_batch_size: 256
train_source_timesteps: 1000
train_timesteps: 100000
num_warmup_steps: 2000

# Curriculum-aware LR scheduler settings
stage_warmup_steps: 1000   # Warmup steps at each curriculum stage transition
min_lr_ratio: 0.1         # Minimum LR as ratio of base LR (10% of base)

# Best model tracking
save_best_model: True
early_stopping_patience: 10  # Number of gen_intervals without improvement before warning

# Speed-oriented diagnostics/evaluation defaults
progress_interval: 50
eval_num_train_envs: 4
eval_num_test_envs: 4
in_context_eval_episodes: 100

# Compile tensor-heavy submodules while leaving RAD recurrence eager.
torch_compile: True
torch_compile_modules:
  - ad_transformer
  - compression_transformer
torch_compile_mode: reduce-overhead
torch_compile_dynamic: True
torch_compile_fullgraph: False
torch_compile_suppress_errors: True

num_workers: 4
