include: config/model/ad_base.yaml

model: RAD

# Compression Transformer (must match rad_dktd.yaml)
tf_n_embd: 64           # Match rad_dktd.yaml and AD baseline
tf_n_layer: 4           # Match rad_dktd.yaml
tf_n_head: 4            # Match rad_dktd.yaml
tf_dropout: 0.1
tf_attn_dropout: 0.1
tf_n_inner: 128         # Match rad_dktd.yaml
n_transit: 72          # 120 environment timesteps = 360 transformer tokens

# Compression Settings (must match rad_dktd.yaml)
n_compress_tokens: 60   # Must be a multiple of 3 for s/a/r token consistency
always_use_latent_prefix: True
compress_n_layers: 4    # Match rad_dktd.yaml
compress_n_heads: 4     # Match rad_dktd.yaml

# Pre-training specific - longer training for better compression
pretrain_timesteps: 50000   # More pretraining for better compression
pretrain_batch_size: 1024
pretrain_lr: 0.0003
pretrain_warmup_steps: 2000

# Dataset
max_context_length: 1000
train_source_timesteps: 1000  # Match fine-tuning config
train_n_stream: 100

# Compile tensor-heavy compression modules while leaving the pretrain wrapper eager.
torch_compile: True
torch_compile_modules:
  - compression_transformer
  - reconstruction_decoder
torch_compile_mode: reduce-overhead
torch_compile_dynamic: True
torch_compile_fullgraph: False
torch_compile_suppress_errors: True

num_workers: 16
