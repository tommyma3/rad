[project]
name = "rad-bandit"
version = "0.1.0"
description = "Delayed adversarial bandits with UCB, AD, and recurrent AD"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "torch>=2.6",
    "einops>=0.8",
    "h5py>=3.12",
    "pyyaml>=6.0",
    "accelerate>=1.3",
    "tensorboard>=2.18",
    "matplotlib>=3.9",
]

[tool.uv]
package = false
