[project]
name = "rad-memory"
version = "0.1.0"
description = "AD and recurrent AD experiments on MiniGrid Memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "einops>=0.8.2",
    "gymnasium>=1.2.3",
    "h5py>=3.16.0",
    "matplotlib>=3.10.9",
    "minigrid>=3.1.0",
    "pyyaml>=6.0.3",
    "sb3-contrib>=2.8.0",
    "stable-baselines3[extra]>=2.8.0",
    "tensorboard>=2.20.0",
    "time-limit>=2017.6.15",
    "torch>=2.12.0",
    "transformers>=5.10.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
