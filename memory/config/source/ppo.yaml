# Source PPO worker configuration for `rad_memory.train_task_pool`.
# Shape matches the source_config.json provenance written by collection runs:
# `source_algorithm` selects the learner, `ppo:` holds the SB3 hyperparameters,
# and the remaining keys set the per-worker training budget. Explicit CLI flags
# (--total-timesteps, --n-steps, ...) override values from this file; unset
# hyperparameters fall back to the dataclass defaults in rad_memory/recurrent_ppo.py.
source_algorithm: ppo

ppo:
  policy: MlpPolicy
  n_steps: 30
  batch_size: 600
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
  n_epochs: 10
  clip_range: 0.2
  vf_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantage: true

# Per-worker training budget (CLI flags override these).
# `streams` parallel env copies of each (task, seed) are stepped together in one
# vec env and trained by one shared learner; each stream writes its own
# `{run_id}-stream-{k}.hdf5` history (streams: 1 keeps the single `{run_id}.hdf5`
# layout). `total_timesteps` is the shared learner budget across all streams, so
# each stream sees roughly total_timesteps / streams env steps; keep
# ppo.batch_size <= ppo.n_steps * streams.
streams: 20
total_timesteps: 100000
evaluation_interval: 5000
evaluation_episodes: 100
minimum_success_rate: 0.9
required_consecutive_evals: 3
source_seeds: [0, 1, 2]
