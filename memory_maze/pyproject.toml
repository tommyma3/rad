[project]
name = "rad-memory-maze"
version = "0.1.0"
description = "Algorithm Distillation and Recurrent Algorithm Distillation on fixed Memory Maze tasks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.13.0",
    "einops>=0.8.2",
    "gymnasium>=1.2.3",
    "h5py>=3.16.0",
    "memory-maze==1.0.3",
    "numpy>=2.0.0",
    "pyyaml>=6.0.3",
    "stable-baselines3[extra]>=2.8.0",
    "tensorboard>=2.20.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
