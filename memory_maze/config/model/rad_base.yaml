model: RAD
num_actions: 6
seed: 42
dataset_root: datasets
mixed_precision: bf16

tf_n_embd: 256
tf_n_layer: 6
tf_n_head: 8
tf_dim_feedforward: 1024
tf_dropout: 0.1
cnn_depth: 32
n_transit: 256
label_smoothing: 0.0

n_compress_tokens: 96
short_memory_keep: 64
always_use_latent_prefix: true
compress_n_layers: 4
compress_n_heads: 8
latent_update_mode: gru_gate
max_gradient_rounds: 6
max_compressions: null
curriculum_schedule:
  - step: 0
    max_compressions: 2
  - step: 25000
    max_compressions: 4
  - step: 50000
    max_compressions: 8
  - step: 75000
    max_compressions: null

min_context_length: 256
max_context_length: 4000
rad_batching_strategy: compression_buckets
dataset_stride: 32

lr: 0.0003
ad_lr: 0.0003
compression_lr: 0.0001
latent_lr: 0.0003
weight_decay: 0.01
grad_clip: 1.0
train_batch_size: 8
test_batch_size: 8
train_timesteps: 100000
num_warmup_steps: 2000
checkpoint_interval: 5000
num_workers: 4
