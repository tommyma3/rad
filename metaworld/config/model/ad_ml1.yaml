include: config/model/ad_base.yaml

model: AD

# Transformer
tf_n_embd: 64
tf_n_layer: 4
tf_n_head: 8
tf_dropout: 0.1
tf_attn_dropout: 0.1
tf_n_inner: 256
tf_dim_feedforward: 256
n_transit: 1000  # Reduced from 1000 to avoid OOM

# training
lr: 0.0003
train_batch_size: 256  # Reduced from 512 to avoid OOM
test_batch_size: 128   # Reduced from 2048 to avoid OOM
train_source_timesteps: 8000
test_source_timesteps: 8000
train_timesteps: 50000
num_warmup_steps: 3000
learn_var: True

train_n_seed: 50
train_n_stream: 100

n_train_envs_per_task: 5
n_test_envs_per_task: 10
test_n_seed: 10

# Compile the transformer while keeping training/evaluation loops eager.
torch_compile: True
torch_compile_modules:
  - transformer
torch_compile_mode: reduce-overhead
torch_compile_dynamic: True
torch_compile_fullgraph: False
torch_compile_suppress_errors: True
torch_compile_cudagraphs: False

eval_num_test_envs: 4

num_workers: 2

