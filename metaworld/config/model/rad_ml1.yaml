include: config/model/ad_base.yaml

model: RAD

# AD Transformer
tf_n_embd: 64
tf_n_layer: 4
tf_n_head: 8
tf_dropout: 0.1
tf_attn_dropout: 0.1
tf_n_inner: 256
tf_dim_feedforward: 256
n_transit: 100           # Reduced context window for efficiency

# Compression Settings
n_compress_tokens: 60    # Multiple of 3 for state/action/reward token consistency
always_use_latent_prefix: True
short_memory_keep: 20    # Recent environment timesteps retained after compression
compress_n_layers: 4
compress_n_heads: 4
latent_update_mode: gru_gate

# Gradient control
max_gradient_rounds: 6

# Curriculum settings (None = unlimited)
max_compressions: null

# Dataset settings
min_context_length: 120
max_context_length: 2500
rad_batching_strategy: compression_buckets

# Curriculum with stage-specific length distributions
curriculum_schedule:
  - step: 0
    max_compressions: 2
    length_distribution:
      short: 0.30       # Less short - need compression practice
      medium: 0.55      # More medium - 1-2 compressions
      long: 0.15
      very_long: 0.00
  - step: 25000
    max_compressions: 4
    length_distribution:
      short: 0.20
      medium: 0.45
      long: 0.30
      very_long: 0.05
  - step: 50000
    max_compressions: 6
    length_distribution:
      short: 0.15
      medium: 0.35
      long: 0.35
      very_long: 0.15
  - step: 75000
    max_compressions: null
    length_distribution:
      short: 0.15
      medium: 0.30
      long: 0.30
      very_long: 0.25

# Training
lr: 0.0003
ad_lr: 0.0003
compression_lr: 0.0001
latent_lr: 0.0003
train_batch_size: 128
test_batch_size: 256
train_source_timesteps: 2500
test_source_timesteps: 2500
train_timesteps: 100000
num_warmup_steps: 2000

train_n_seed: 50
train_n_stream: 100

n_train_envs_per_task: 5
n_test_envs_per_task: 10
test_n_seed: 10

# Curriculum-aware LR scheduler settings
stage_warmup_steps: 1000
min_lr_ratio: 0.1

# Best model tracking
save_best_model: True
early_stopping_patience: 10

progress_interval: 50
eval_num_test_envs: 50
in_context_eval_episodes: 100

# Compile tensor-heavy modules while leaving recurrent compression eager.
torch_compile: True
torch_compile_modules:
  - ad_transformer
  - compression_transformer
torch_compile_mode: reduce-overhead
torch_compile_dynamic: True
torch_compile_fullgraph: False
torch_compile_suppress_errors: True

num_workers: 4

# Compression pretraining overrides. The pretraining entry point overlays this
# section onto the shared RAD configuration before constructing the model.
pretrain:
  pretrain_timesteps: 50000
  pretrain_batch_size: 256
  pretrain_lr: 0.0003
  pretrain_warmup_steps: 3000

  torch_compile_modules:
    - compression_transformer
    - reconstruction_decoder
