include: config/model/ad_dktd.yaml

env: dktd
model: AD_DPT
tokenization: gridworld-packed-transition-query-last-v1
collection_env_split_seed: 2
# 99 completed transitions plus the final query.
policy_token_budget: 100
lengths_per_batch: 4
mixed_precision: fp16
torch_compile_modules:
  - ad_transformer
