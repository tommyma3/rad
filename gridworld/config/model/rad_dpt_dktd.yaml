include: config/model/rad_dktd.yaml

env: dktd
model: RAD_DPT
tokenization: gridworld-packed-transition-query-last-v1
collection_env_split_seed: 2
# Keep the baseline's 60 latent vectors and 10 retained complete transitions.
# 71 history slots before compression; afterwards 11 + 60 latents + one query.
# Thus compression recurs every TWO appended transitions after the first event.
policy_token_budget: 72
rad_batching_strategy: endpoint_lengths
min_context_length: 0
lengths_per_batch: 4
mixed_precision: fp16
torch_compile: False
