include: config/model/rad_dr.yaml

# Compressor comparison under the standard train_rad.py protocol: the legacy
# goal split, compiled RAD modules, and the vanilla optimizer step, exactly as
# for the historical RAD-darkroom-seed* runs. compressor_type is the only
# experimental variable; the ae/vae/vq_vae configs add it on top of this base.
# Protocol tag: darkroom-compressor-legacy-v1.
vae_kl_weight: 0.001
vae_kl_warmup_steps: 5000
vae_eval_mode: mean
vq_codebook_size: 256
vq_commitment_weight: 0.25
