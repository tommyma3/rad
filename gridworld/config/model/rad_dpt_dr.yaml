include: config/model/rad_dr.yaml

model: RAD_DPT
tokenization: gridworld-packed-transition-query-last-v1
# Packed policy slots INCLUDING the query and any latent prefix.
# Before compression: 29 completed transitions. Afterwards: 14 + 15 latents + query.
# All 15 latent vectors and the 5-transition retained suffix remain unchanged.
policy_token_budget: 30
rad_batching_strategy: endpoint_lengths
min_context_length: 0
lengths_per_batch: 4
mixed_precision: fp16
torch_compile: False
